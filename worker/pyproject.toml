[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-studio-worker"
version = "2.0.0"
description = "YT Studio v2 worker: claims jobs from the brain's Postgres and runs media tasks"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# NVIDIA laptop (and any machine that should transcribe)
transcribe = ["faster-whisper>=1.1"]
# any machine with the `download` capability (yt-dlp nightly channel: pip install -U --pre yt-dlp)
download = ["yt-dlp>=2025.1.1"]
dev = ["pytest>=8"]

[project.scripts]
yt-worker = "worker.agent.main:main"

[tool.setuptools]
# The package root is this directory, importable as `worker` (worker.core, worker.agent).
package-dir = { "worker" = "." }
packages = ["worker", "worker.core", "worker.agent", "worker.agent.jobs"]
