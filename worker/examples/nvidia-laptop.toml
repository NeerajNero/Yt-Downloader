# Transcription worker — NVIDIA laptop (GTX 1650, 4 GB VRAM), Windows 11.
# Copy to C:\ytstudio\worker.toml and fill in the tailnet address + secrets
# (POSTGRES_PASSWORD / HASURA_ADMIN_SECRET from the brain's .env).
name = "nvidia-laptop"
os = "windows-11"
# Only the first-time default — afterwards assign jobs on the PWA's Machines page.
capabilities = ["transcribe"]
database_url = "postgres://ytstudio:POSTGRES_PASSWORD@100.x.y.z:5433/ytstudio?sslmode=disable"  # port = POSTGRES_PORT in the brain's .env
brain_url = "http://100.x.y.z:8085"                    # port = WEB_PORT in the brain's .env
api_secret = "HASURA_ADMIN_SECRET"
ffmpeg_path = "C:/ffmpeg/bin/ffmpeg.exe"
work_dir = "C:/ytstudio/work"

[whisper]
model = "small"              # try "medium" — fits 4 GB at int8_float16
device = "cuda"
compute_type = "int8_float16"
