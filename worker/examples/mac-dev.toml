# Dev worker on the Mac against the local compose stack (docker compose up).
name = "mac-dev"
os = "macos"
# Only the first-time default — afterwards assign jobs on the PWA's Machines page.
capabilities = ["noop", "transcribe", "render"]
database_url = "postgres://ytstudio:devpass@localhost:5433/ytstudio"
brain_url = "http://localhost:8080"
api_secret = "devsecret"
ffmpeg_path = "/opt/homebrew/opt/ffmpeg-full/bin/ffmpeg"   # plain homebrew ffmpeg lacks libass
encoder = "h264_videotoolbox"
work_dir = "work"

[whisper]
model = "small"
device = "cpu"
compute_type = "int8"
