# YT Studio v2 — brain stack (runs on the Ubuntu server; also runs locally for dev).
#
#   cp .env.example .env   # then fill in the v2 section
#   docker compose up -d --build
#
# Entry point is the web service (Caddy) on ${WEB_PORT:-8080}; on the server,
# point `tailscale serve` at it:  tailscale serve --bg http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ytstudio
    # Exposed on the host so workers reach it over the tailnet (Phase 1).
    # 5433 locally on the Mac (5432 is taken); keep 5432 on the server.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytstudio -d ytstudio"]
      interval: 5s
      timeout: 3s
      retries: 10

  hasura:
    # cli-migrations image auto-applies hasura/migrations + hasura/metadata on boot,
    # so a fresh server needs no manual migrate step.
    image: hasura/graphql-engine:v2.48.3.cli-migrations-v3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://ytstudio:${POSTGRES_PASSWORD}@postgres:5432/ytstudio
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?set HASURA_ADMIN_SECRET in .env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log
      HASURA_GRAPHQL_MIGRATIONS_DIR: /hasura-migrations
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      # Cron triggers send this as x-api-secret to the api (Hasura forbids
      # HASURA_GRAPHQL_* names in value_from_env, hence the alias).
      WATCHDOG_SECRET: ${HASURA_ADMIN_SECRET}
      ACTIONS_BASE_URL: http://api:8000
    volumes:
      - ./hasura/migrations:/hasura-migrations:ro
      - ./hasura/metadata:/hasura-metadata:ro
    # Direct port for the Hasura console and the hasura CLI (admin only).
    ports:
      - "${HASURA_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: yt-studio-brain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ytstudio:${POSTGRES_PASSWORD}@postgres:5432/ytstudio
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      LIBRARY_DIR: /library
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      WOL_URL: http://host.docker.internal:9910
      WOL_BROADCAST: ${WOL_BROADCAST:-255.255.255.255}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LIBRARY_DIR:-./downloads}:/library
      # one-off scripts, e.g.: docker compose exec api python scripts/import_v1_library.py
      - ./scripts:/srv/scripts:ro

  # Brain-side worker: has the library mounted, so download/scenes/convert/
  # clip packs/silence removal and the Gemini jobs run here without any file
  # transfer. Renders go to the gaming PC (h264_amf); enable `render` here too
  # if you want slow libx264 fallback renders on the brain.
  worker:
    image: yt-studio-brain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["yt-worker"]
    environment:
      YT_WORKER_NAME: brain
      YT_WORKER_CAPABILITIES: ${BRAIN_WORKER_CAPABILITIES:-download,scenes,borders,convert,clippack,tighten,suggest,postkit}
      YT_WORKER_DATABASE_URL: postgres://ytstudio:${POSTGRES_PASSWORD}@postgres:5432/ytstudio
      YT_WORKER_BRAIN_URL: http://api:8000
      YT_WORKER_API_SECRET: ${HASURA_ADMIN_SECRET}
      YT_WORKER_LIBRARY_DIR: /library
      YT_WORKER_WORK_DIR: /work
      YT_WORKER_ENCODER: libx264
      YT_WORKER_OS: ubuntu-server
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
    volumes:
      - ${LIBRARY_DIR:-./downloads}:/library
      - workdata:/work

  # Wake-on-LAN sidecar on the host network (a bridged container can't
  # broadcast to the LAN). The api posts MACs to it on :9910.
  wol:
    image: yt-studio-brain
    restart: unless-stopped
    network_mode: host
    command: ["python", "-m", "app.wol_server"]
    environment:
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      WOL_BROADCAST: ${WOL_BROADCAST:-255.255.255.255}
      WOL_PORT: "9910"

  web:
    # Multi-stage build: node builds the PWA, Caddy serves it and proxies
    # /v1/* (GraphQL + websockets) to hasura and /api/* to the api service.
    build:
      context: ./web
      args:
        VITE_HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
    restart: unless-stopped
    depends_on:
      - hasura
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  workdata:
