table:
  name: videos
  schema: public
array_relationships:
  - name: assets
    using:
      foreign_key_constraint_on:
        column: video_id
        table:
          name: assets
          schema: public
  - name: clips
    using:
      foreign_key_constraint_on:
        column: video_id
        table:
          name: clips
          schema: public
  - name: jobs
    using:
      foreign_key_constraint_on:
        column: video_id
        table:
          name: jobs
          schema: public
event_triggers:
  - name: video_status
    definition:
      enable_manual: true
      update:
        columns:
          - status
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: http://api:8000/api/events/video
    headers:
      - name: x-api-secret
        value_from_env: WATCHDOG_SECRET
