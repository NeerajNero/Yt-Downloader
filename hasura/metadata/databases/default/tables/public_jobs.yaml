table:
  name: jobs
  schema: public
object_relationships:
  - name: machine
    using:
      foreign_key_constraint_on: claimed_by
  - name: parent_job
    using:
      foreign_key_constraint_on: parent_job_id
  - name: video
    using:
      foreign_key_constraint_on: video_id
array_relationships:
  - name: assets
    using:
      foreign_key_constraint_on:
        column: job_id
        table:
          name: assets
          schema: public
  - name: child_jobs
    using:
      foreign_key_constraint_on:
        column: parent_job_id
        table:
          name: jobs
          schema: public
