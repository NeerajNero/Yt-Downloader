table:
  name: clips
  schema: public
object_relationships:
  - name: job
    using:
      foreign_key_constraint_on: job_id
  - name: video
    using:
      foreign_key_constraint_on: video_id
array_relationships:
  - name: jobs
    using:
      foreign_key_constraint_on:
        column: clip_id
        table:
          name: jobs
          schema: public
