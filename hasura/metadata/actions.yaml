actions:
  - name: probe_url
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/api/actions/probe_url'
      timeout: 60
      headers:
        - name: x-api-secret
          value_from_env: WATCHDOG_SECRET
    comment: yt-dlp metadata for a URL (nothing downloaded)
  - name: start_download
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/api/actions/start_download'
      timeout: 60
      headers:
        - name: x-api-secret
          value_from_env: WATCHDOG_SECRET
    comment: Create the video row + download job (ideas inbox entry point)
  - name: enqueue_job
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/api/actions/enqueue_job'
      timeout: 30
      headers:
        - name: x-api-secret
          value_from_env: WATCHDOG_SECRET
    comment: Validated job insert (payload checked against the worker schemas)
  - name: wake_machine
    definition:
      kind: synchronous
      handler: '{{ACTIONS_BASE_URL}}/api/actions/wake_machine'
      timeout: 30
      headers:
        - name: x-api-secret
          value_from_env: WATCHDOG_SECRET
    comment: Send a Wake-on-LAN magic packet
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: ProbeResult
    - name: StartDownloadOutput
    - name: EnqueueOutput
    - name: WakeOutput
  scalars: []
